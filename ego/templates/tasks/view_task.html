<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ task.title }}</title>
</head>
<body>
    <h1>{{ task.title }}</h1>
    <p><strong>Описание:</strong> {{ task.description }}</p>
    <p><strong>Статус:</strong> {% if task.completed %}Выполнено ✅{% else %}Не выполнено ❌{% endif %}</p>
    <p><strong>Дата создания:</strong> {{ task.created_at }}</p>
    
    <br>
    <a href="{% url 'edit_task' task.id %}">Редактировать</a> | 
    <a href="{% url 'index' %}">Назад к списку</a>
</body>
</html>
