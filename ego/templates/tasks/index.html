<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Список задач</title>
</head>
<body>
    <h1>Мои задачи</h1>
    <a href="{% url 'create_task' %}">+ Создать новую задачу</a>
    
    <ul>
        {% for task in tasks %}
            <li>
                <a href="{% url 'view_task' task.id %}">{{ task.title }}</a> 
                {% if task.completed %}(Выполнено){% else %}(В процессе){% endif %}
                | <a href="{% url 'edit_task' task.id %}">Изменить</a>
                | <a href="{% url 'delete_task' task.id %}">Удалить</a>
            </li>
        {% empty %}
            <p>Пока нет ни одной задачи.</p>
        {% endfor %}
    </ul>
</body>
</html>
