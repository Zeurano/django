<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Редактировать задачу</title>
</head>
<body>
    <h1>Редактировать задачу</h1>
    
    <form method="POST">
        {% csrf_token %}
        <label>Название:</label><br>
        <input type="text" name="title" value="{{ task.title }}" required><br><br>
        
        <label>Описание:</label><br>
        <textarea name="description">{{ task.description }}</textarea><br><br>
        
        <label>
            <input type="checkbox" name="completed" {% if task.completed %}checked{% endif %}> Выполнено
        </label><br><br>
        
        <button type="submit">Сохранить изменения</button>
    </form>
    
    <br>
    <a href="{% url 'index' %}">Назад</a>
</body>
</html>
