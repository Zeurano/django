<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Удаление задачи</title>
</head>
<body>
    <h1>Удалить задачу?</h1>
    <p>Ты уверен, что хочешь удалить задачу: <strong>"{{ task.title }}"</strong>?</p>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="color: red;">Да, удалить</button>
    </form>
    
    <br>
    <a href="{% url 'index' %}">Отмена</a>
</body>
</html>
