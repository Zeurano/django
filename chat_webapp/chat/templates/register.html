<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Блог</title>
    <!-- Подключаем Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-register {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            background: #ffffff;
        }
        .btn-custom {
            background-color: #0d6efd;
            color: white;
            font-weight: 500;
            border-radius: 8px;
            padding: 10px;
        }
        .btn-custom:hover {
            background-color: #0b5ed7;
            color: white;
        }
    </style>
</head>
<body>

    <div class="card card-register">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark">Добро пожаловать!</h3>
            <p class="text-muted">Введите ваше имя для входа</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                {{ form.as_p }}
            </div>
            <button type="submit" class="btn btn-custom w-100">Продолжить</button>
        </form>
    </div>

</body>
</html>
